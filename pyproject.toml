[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "linkedin_scraper"
version = "3.1.2"
description = "Async LinkedIn scraper for profiles, companies, and jobs"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "Apache 2.0"}
authors = [
    {name = "Joey Sham", email = "sham.joey@gmail.com"}
]
keywords = ["linkedin", "scraping", "scraper", "async", "playwright", "profiles"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]

dependencies = [
    "playwright>=1.40.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "build>=1.0.0",
    "twine>=4.0.0",
    "wheel>=0.40.0",
    "ruff>=0.4.0",
    "mypy>=1.8.0",
]

[project.scripts]
linkedin-scraper = "linkedin_scraper.cli.main:main"

[project.urls]
Homepage = "https://github.com/joeyism/linkedin_scraper"
Documentation = "https://github.com/joeyism/linkedin_scraper#readme"
Repository = "https://github.com/joeyism/linkedin_scraper"
Issues = "https://github.com/joeyism/linkedin_scraper/issues"

[tool.setuptools.packages.find]
include = ["linkedin_scraper*"]

[tool.setuptools.package-data]
linkedin_scraper = ["py.typed"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --tb=short"
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: Unit tests that don't require external services",
    "integration: Integration tests that require LinkedIn session",
    "slow: Slow-running tests",
    "e2e: End-to-end tests requiring full setup",
]

[tool.coverage.run]
source = ["linkedin_scraper"]
omit = ["*/tests/*"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true
packages = ["linkedin_scraper"]
