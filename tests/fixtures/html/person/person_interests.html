<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Alex Morgan - Interests | LinkedIn</title>
</head>
<body>
  <header>
    <nav class="global-nav">
      <a class="global-nav__primary-link" href="https://www.linkedin.com/feed/">Home</a>
    </nav>
  </header>
  <main class="scaffold-layout__main">
    <div class="pvs-header">
      <h2>Interests</h2>
    </div>
    <div class="artdeco-tabs" role="tablist">
      <button role="tab" class="artdeco-tab artdeco-tab--selected" aria-selected="true" data-tab="Companies">
        <span>Companies</span>
      </button>
      <button role="tab" class="artdeco-tab" aria-selected="false" data-tab="Top Voices">
        <span>Top Voices</span>
      </button>
      <button role="tab" class="artdeco-tab" aria-selected="false" data-tab="Schools">
        <span>Schools</span>
      </button>
    </div>

    <!-- Tabpanel: Companies -->
    <div role="tabpanel" class="artdeco-tabpanel" data-tabpanel="Companies">
      <ul class="pvs-list">
        <li class="pvs-list__paged-list-item">
          <div data-view-name="profile-component-entity" class="display-flex flex-row">
            <a class="optional-action-target-wrapper" href="https://www.linkedin.com/company/google">
              <div class="display-flex flex-column">
                <span aria-hidden="true" class="t-bold">Google</span>
                <span class="t-14 t-normal t-black--light">32,450,120 followers</span>
              </div>
            </a>
          </div>
        </li>
        <li class="pvs-list__paged-list-item">
          <div data-view-name="profile-component-entity" class="display-flex flex-row">
            <a class="optional-action-target-wrapper" href="https://www.linkedin.com/company/microsoft">
              <div class="display-flex flex-column">
                <span aria-hidden="true" class="t-bold">Microsoft</span>
                <span class="t-14 t-normal t-black--light">21,890,340 followers</span>
              </div>
            </a>
          </div>
        </li>
      </ul>
    </div>

    <!-- Tabpanel: Top Voices -->
    <div role="tabpanel" class="artdeco-tabpanel" data-tabpanel="Top Voices">
      <ul class="pvs-list">
        <li class="pvs-list__paged-list-item">
          <div data-view-name="profile-component-entity" class="display-flex flex-row">
            <a class="optional-action-target-wrapper" href="https://www.linkedin.com/in/satyanadella">
              <div class="display-flex flex-column">
                <span aria-hidden="true" class="t-bold">Satya Nadella</span>
                <span class="t-14 t-normal t-black--light">Top Voice</span>
              </div>
            </a>
          </div>
        </li>
      </ul>
    </div>

    <!-- Tabpanel: Schools -->
    <div role="tabpanel" class="artdeco-tabpanel" data-tabpanel="Schools">
      <ul class="pvs-list">
        <li class="pvs-list__paged-list-item">
          <div data-view-name="profile-component-entity" class="display-flex flex-row">
            <a class="optional-action-target-wrapper" href="https://www.linkedin.com/school/stanford-university/">
              <div class="display-flex flex-column">
                <span aria-hidden="true" class="t-bold">Stanford University</span>
              </div>
            </a>
          </div>
        </li>
      </ul>
    </div>
  </main>
</body>
</html>
