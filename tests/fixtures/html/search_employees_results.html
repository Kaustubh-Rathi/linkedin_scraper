<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Employee Search Results | LinkedIn</title>
</head>
<body>
  <div class="search-results-container">
    <ul class="reusable-search__entity-result-list">
      <!-- Employee 1: Clean standard employee result -->
      <li class="reusable-search__result-container">
        <div class="entity-result">
          <div class="entity-result__title-text">
            <a class="app-aware-link" href="https://www.linkedin.com/in/marcus-vance?trk=org-employees">
              Marcus Vance
            </a>
          </div>
          <div class="entity-result__primary-subtitle">Principal Software Engineer at Microsoft</div>
          <div class="entity-result__secondary-subtitle">Redmond, WA</div>
        </div>
      </li>

      <!-- Employee 2: Whitespace variations, degree connection badges -->
      <li class="reusable-search__result-container">
        <div class="entity-result">
          <div class="entity-result__title-text">
            <a class="app-aware-link" href="https://www.linkedin.com/in/priya-patel-cloud/">
              
              Priya Patel
              
              <span class="visually-hidden">2nd degree connection</span>
            </a>
          </div>
          <div class="entity-result__primary-subtitle">
            Senior Engineering Manager | Azure Kubernetes Service
          </div>
          <div class="entity-result__secondary-subtitle">
            Seattle, Washington, United States
          </div>
        </div>
      </li>

      <!-- Employee 3: Missing designation -->
      <li class="reusable-search__result-container">
        <div class="entity-result">
          <div class="entity-result__title-text">
            <a class="app-aware-link" href="https://www.linkedin.com/in/alex-turner-889/">
              Alex Turner
            </a>
          </div>
        </div>
      </li>

      <!-- Employee 4: Out of network LinkedIn Member -->
      <li class="reusable-search__result-container">
        <div class="entity-result">
          <div class="entity-result__title-text">
            <a class="app-aware-link" href="https://www.linkedin.com/in/ACoAAB555999">
              LinkedIn Member
            </a>
          </div>
          <div class="entity-result__primary-subtitle">Member of Technical Staff</div>
        </div>
      </li>
    </ul>
  </div>
</body>
</html>
